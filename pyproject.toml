[project]
name = "deal-doc-assistant"
version = "0.1.0"
description = "M&A RAG document project"
readme = "README.md"
authors = [
    { name = "OmarGit99", email = "omarshaikh@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.4",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rank-bm25>=0.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
